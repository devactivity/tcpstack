[package]
name = "tcpstack"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.10.1"
clap = { version = "4.5.42", features = ["derive"] }
f_log = "0.1.7"
rand = "0.9.1"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[[bin]]
name = "rustnet-demo"
path = "src/main.rs"

[[bin]]
name = "rust-tcp-demo"
path = "src/simple_demo.rs"
